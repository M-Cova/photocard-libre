Name: PhotoCard Libre
Summary: Create printable photo cards and A4 PDFs offline
Description: |-
  Create printable photo cards directly on an Android device. Select and crop
  photos, add short captions, reorder the cards, preview the result, and export
  an A4 PDF for saving or sharing.

  The app works locally, without accounts, advertising, tracking, analytics, or
  Internet access. It can also support Augmentative and Alternative
  Communication workflows, but is not a replacement for dedicated AAC tools.

RepoType: git
